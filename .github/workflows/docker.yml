name: Test and publish Docker images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - Dockerfile
      - entrypoint.sh
      - train_lerobot.py
      - lerobot_v3_compat.py
      - test_lerobot_v3_compat.py
      - requirements-test.txt
      - .dockerignore
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - entrypoint.sh
      - train_lerobot.py
      - lerobot_v3_compat.py
      - test_lerobot_v3_compat.py
      - requirements-test.txt
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: train-openpi-images-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ioaitech/train_openpi

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run tests
        run: python -m pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - variant: pi0-cuda126
            model_type: pi0
          - variant: pi05-cuda126
            model_type: pi05

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      - name: Show disk space
        run: df -h

      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.variant }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=pi0,enable=${{ matrix.variant == 'pi0-cuda126' && github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ matrix.variant == 'pi0-cuda126' && github.ref == 'refs/heads/main' }}
            type=raw,value=pi05,enable=${{ matrix.variant == 'pi05-cuda126' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},suffix=-${{ matrix.variant }}
            type=sha,suffix=-${{ matrix.variant }}
          labels: |
            org.opencontainers.image.title=IOAI OpenPI Trainer (${{ matrix.variant }})
            org.opencontainers.image.licenses=Apache-2.0
            io.ioai.train-openpi.variant=${{ matrix.variant }}
            io.ioai.train-openpi.model-type=${{ matrix.model_type }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MODEL_TYPE=${{ matrix.model_type }}
            LEROBOT_VERSION=auto
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:${{ matrix.variant }}
          cache-to: type=inline
          provenance: mode=max
          sbom: true
